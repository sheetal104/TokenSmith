embed_model: "models/Qwen3-Embedding-4B-Q5_K_M.gguf"
embed_n_ctx: 8192
top_k: 5
pool_size: 50
ensemble_method: "rrf"
ranker_weights: {"faiss":1,"bm25":0}
rrf_k: 60
max_gen_tokens: 400
seg_filter: null
chunk_mode: "sections"
model_path: "models/qwen2.5-1.5b-instruct-q5_k_m.gguf"
recursive_chunk_size: 2000
recursive_overlap: 200
use_hyde: false
hyde_max_tokens: 600

# Query Type Classification & Dynamic Planning
use_query_planner: true

# Adaptive Context Window Management
use_adaptive_context: true
adaptive_min_chunks: 3
adaptive_max_chunks: 10
adaptive_relevance_threshold: 0.5
adaptive_quality_variance_threshold: 0.15
adaptive_max_tokens: 4000

# Query Embedding Cache
use_query_cache: true
query_cache_size: 1000
